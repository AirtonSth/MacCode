name: RemoteCodeWatch
options:
  deploymentTarget:
    watchOS: "10.0"
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
targets:
  RemoteCodeWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/App
      - path: Sources/Core
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        MARKETING_VERSION: 1.0
        PRODUCT_BUNDLE_IDENTIFIER: io.remotecode.watch
        PRODUCT_NAME: RemoteCodeWatch
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: 4
  RemoteCodeWatchLogicTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Tests/RemoteCodeWatchLogicTests
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 1.0
        PRODUCT_BUNDLE_IDENTIFIER: io.remotecode.watch.tests
        PRODUCT_NAME: RemoteCodeWatchLogicTests
        SWIFT_VERSION: 5.10
schemes:
  RemoteCodeWatch:
    build:
      targets:
        RemoteCodeWatch: all
  RemoteCodeWatchLogic:
    build:
      targets:
        RemoteCodeWatchLogicTests: all
    test:
      targets:
        - name: RemoteCodeWatchLogicTests

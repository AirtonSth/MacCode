name: RemoteCodeWatch
options:
  deploymentTarget:
    watchOS: "10.0"
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
targets:
  RemoteCodeWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/App
      - path: Sources/Core
      - path: Assets.xcassets
    entitlements:
      path: Sources/App/RemoteCodeWatch.entitlements
    dependencies:
      - target: RemoteCodeWatchComplication
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        MARKETING_VERSION: 1.0.3
        PRODUCT_BUNDLE_IDENTIFIER: io.remotecode.watch
        PRODUCT_NAME: RemoteCodeWatch
        SKIP_INSTALL: NO
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: 4
  RemoteCodeWatchComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: Sources/Widget
      - path: Sources/Core
    entitlements:
      path: Sources/Widget/RemoteCodeWatchComplication.entitlements
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        MARKETING_VERSION: 1.0.3
        PRODUCT_BUNDLE_IDENTIFIER: io.remotecode.watch.complication
        PRODUCT_NAME: RemoteCodeWatchComplication
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: 4
  RemoteCodeWatchLogicTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Tests/RemoteCodeWatchLogicTests
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 1.0.3
        PRODUCT_BUNDLE_IDENTIFIER: io.remotecode.watch.tests
        PRODUCT_NAME: RemoteCodeWatchLogicTests
        SWIFT_VERSION: "5.10"
schemes:
  RemoteCodeWatch:
    build:
      targets:
        RemoteCodeWatch: all
  RemoteCodeWatchComplication:
    build:
      targets:
        RemoteCodeWatchComplication: all
  RemoteCodeWatchLogicTests:
    build:
      targets:
        RemoteCodeWatchLogicTests: all
    test:
      targets:
        - name: RemoteCodeWatchLogicTests

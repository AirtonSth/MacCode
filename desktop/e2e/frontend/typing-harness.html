<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<title>Frontend Typing Harness</title>
		<style>
			body {
				margin: 0;
				background: #020617;
				color: #e2e8f0;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}

			.container {
				max-width: 960px;
				margin: 24px auto;
				padding: 16px;
			}

			.panel {
				border: 1px solid rgba(255, 255, 255, 0.12);
				border-radius: 12px;
				padding: 12px;
				background: rgba(15, 23, 42, 0.7);
			}

			.controls {
				display: flex;
				gap: 8px;
				margin: 8px 0 0;
			}

			textarea,
			input,
			select,
			button {
				font: inherit;
			}

			textarea,
			input {
				width: 100%;
				box-sizing: border-box;
				border: 1px solid rgba(255, 255, 255, 0.2);
				border-radius: 10px;
				padding: 10px;
				background: rgba(15, 23, 42, 0.9);
				color: #e2e8f0;
			}

			textarea {
				min-height: 72px;
				resize: vertical;
			}

			select,
			button {
				border: 1px solid rgba(255, 255, 255, 0.2);
				border-radius: 8px;
				padding: 8px 10px;
				background: rgba(15, 23, 42, 0.9);
				color: #e2e8f0;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<section class="panel">
				<textarea aria-label="Message input" placeholder="Ask for follow-up changes"></textarea>
				<div class="controls">
					<select aria-label="Model">
						<option>GPT-5.3-Codex-Spark</option>
					</select>
					<select aria-label="Reasoning">
						<option>extra high</option>
					</select>
					<select aria-label="Permission mode">
						<option>Full access</option>
					</select>
				</div>
			</section>
			<section class="panel" style="margin-top: 12px;">
				<input aria-label="Terminal command" placeholder="Run command (example: ls -la)" type="text" />
				<button style="margin-top: 8px;" type="button">Run</button>
			</section>
		</div>
	</body>
</html>

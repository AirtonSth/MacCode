<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<meta content="Electronbun desktop app with React and Vite." name="description" />
		<title>Remotecode</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preconnect" href="http://127.0.0.1:8835" />
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
			media="print"
			onload="this.media='all'"
		/>
		<style>
			html,
			body,
			#root {
				height: 100%;
				width: 100%;
				margin: 0;
				background: transparent;
			}
			#initial-splash {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background:
					radial-gradient(circle at 20% 10%, rgba(97, 196, 255, 0.12), transparent 50%),
					radial-gradient(circle at 80% 90%, rgba(247, 98, 169, 0.1), transparent 55%),
					#0b0f1a;
				z-index: 9999;
				pointer-events: none;
				transition: opacity 160ms ease-out;
			}
			#initial-splash[data-hide="true"] {
				opacity: 0;
			}
			.initial-splash__spinner {
				width: 28px;
				height: 28px;
				border-radius: 50%;
				border: 2px solid rgba(255, 255, 255, 0.12);
				border-top-color: #55c7ff;
				animation: initial-splash-spin 0.7s linear infinite;
			}
			@keyframes initial-splash-spin {
				to {
					transform: rotate(360deg);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.initial-splash__spinner {
					animation-duration: 1.5s;
				}
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<div id="initial-splash" aria-hidden="true">
			<div class="initial-splash__spinner"></div>
		</div>
		<script src="/main.tsx" type="module"></script>
	</body>
</html>

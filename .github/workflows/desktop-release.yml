name: Desktop Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 2.0.0). Defaults to VERSION."
        required: false

permissions:
  contents: write

env:
  APP_NAME: RemoteCode
  BUNDLE_ID: io.remotecode.desktop

jobs:
  build:
    name: Build macOS
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Resolve version
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ -n "${VERSION_INPUT:-}" ]; then
            VERSION="$VERSION_INPUT"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -f VERSION ]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          else
            VERSION="0.1.0"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Resolve Swift packages
        run: swift package resolve

      - name: Run tests
        run: ./scripts/test-unit.sh

      - name: Package app
        env:
          RC2_VERSION: ${{ steps.version.outputs.value }}
          RC2_BUNDLE_ID: ${{ env.BUNDLE_ID }}
          RC2_CONFIG: release
        run: ./scripts/package-app.sh

      - name: Import signing certificate
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          if [ -z "${MACOS_CERTIFICATE:-}" ]; then
            echo "Signing certificate not configured; build will remain unsigned."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          if ! echo -n "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH" 2>/dev/null; then
            echo -n "$MACOS_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Sign and notarize app
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          ELECTROBUN_TEAMID: ${{ secrets.ELECTROBUN_TEAMID }}
          ELECTROBUN_APPLEID: ${{ secrets.ELECTROBUN_APPLEID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.ELECTROBUN_APPLEIDPASS }}
        run: |
          APP="dist/${APP_NAME}.app"

          if [ -z "${MACOS_CERTIFICATE:-}" ]; then
            echo "Signing skipped; MACOS_CERTIFICATE is not configured."
            exit 0
          fi

          if [ -z "${ELECTROBUN_DEVELOPER_ID:-}" ]; then
            echo "::error::ELECTROBUN_DEVELOPER_ID is required when MACOS_CERTIFICATE is configured."
            exit 1
          fi

          codesign --force --deep --options runtime --timestamp --sign "$ELECTROBUN_DEVELOPER_ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          if [ -n "${ELECTROBUN_APPLEID:-}" ] && [ -n "${ELECTROBUN_APPLEIDPASS:-}" ] && [ -n "${ELECTROBUN_TEAMID:-}" ]; then
            ditto -c -k --keepParent "$APP" "dist/${APP_NAME}-notary.zip"
            xcrun notarytool submit "dist/${APP_NAME}-notary.zip" \
              --apple-id "$ELECTROBUN_APPLEID" \
              --password "$ELECTROBUN_APPLEIDPASS" \
              --team-id "$ELECTROBUN_TEAMID" \
              --wait
            xcrun stapler staple "$APP"
          else
            echo "Notarization skipped; Apple ID, app password, or team ID is not configured."
          fi

      - name: Create release archive
        shell: bash
        run: |
          mkdir -p artifacts
          ARCHIVE="artifacts/${APP_NAME}-${{ steps.version.outputs.value }}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/${APP_NAME}.app" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macOS
          path: artifacts/*

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -lhR release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RemoteCode ${{ steps.version.outputs.value }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-canary') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Desktop Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 1.2.0). Defaults to desktop/package.json version."
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(bun -e "console.log(require('./desktop/package.json').version)")
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Determine build environment
        id: build-env
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *"-canary"* ]]; then
            echo "env=canary" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "env=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Electrobun install
        run: |
          EBUN_PKG="node_modules/electrobun/package.json"
          EBUN_VER=$(bun -e "console.log(require('./$EBUN_PKG').version)")
          echo "Electrobun version: $EBUN_VER"
          echo "Electrobun path: $(pwd)/$EBUN_PKG"

      - name: Pre-download Electrobun core binaries
        run: |
          # Electrobun CLI resolves core binaries relative to cwd:
          #   join(process.cwd(), "node_modules", "electrobun", "dist-<os>-<arch>")
          # Build steps use working-directory: desktop, so we must place
          # binaries at desktop/node_modules/electrobun/dist-*.
          # Bun workspaces hoists electrobun to root node_modules/, so we
          # symlink it into the desktop workspace for the CLI to find.
          EBUN_ROOT="$(pwd)/node_modules/electrobun"
          EBUN_VER=$(bun -e "console.log(require('${EBUN_ROOT}/package.json').version)")
          EBUN_TAG="v${EBUN_VER}"

          download_core() {
            local tarball_name="$1"
            local dist_name="$2"
            local dist_dir="${EBUN_ROOT}/${dist_name}"

            if [ -d "$dist_dir" ] && [ "$(ls -A "$dist_dir" 2>/dev/null)" ]; then
              echo "Core binaries for $tarball_name already present"
              return
            fi

            local url="https://github.com/blackboardsh/electrobun/releases/download/${EBUN_TAG}/electrobun-core-${tarball_name}.tar.gz"
            echo "Downloading $tarball_name -> $dist_dir"
            mkdir -p "$dist_dir"
            curl -fsSL "$url" -o "/tmp/ebun-${tarball_name}.tar.gz"
            tar -xzf "/tmp/ebun-${tarball_name}.tar.gz" -C "$dist_dir"
            rm -f "/tmp/ebun-${tarball_name}.tar.gz"
            echo "  Extracted: $(ls "$dist_dir" | head -5)..."
          }

          download_core "darwin-arm64" "dist-macos-arm64"
          download_core "darwin-x64"   "dist-macos-x64"
          download_core "linux-arm64"  "dist-linux-arm64"
          download_core "linux-x64"    "dist-linux-x64"
          download_core "win-x64"      "dist-win-x64"

          # Symlink hoisted electrobun into desktop workspace so the CLI
          # finds core binaries when running with working-directory: desktop
          mkdir -p desktop/node_modules
          ln -sfn ../../node_modules/electrobun desktop/node_modules/electrobun
          echo "Symlinked desktop/node_modules/electrobun -> ../node_modules/electrobun"
          ls desktop/node_modules/electrobun/dist-macos-arm64/ | head -3

      - name: Build frontend
        working-directory: desktop
        run: bun run build:vite

      # Electrobun deletes artifacts/ on each build invocation, so we
      # collect outputs into a separate release/ directory after each step.
      - name: Build desktop — macOS (arm64 + x64)
        working-directory: desktop
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          ELECTROBUN_TEAMID: ${{ secrets.ELECTROBUN_TEAMID }}
          ELECTROBUN_APPLEID: ${{ secrets.ELECTROBUN_APPLEID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.ELECTROBUN_APPLEIDPASS }}
        run: |
          npx electrobun build --env=${{ steps.build-env.outputs.env }} --targets=macos-arm64,macos-x64
          mkdir -p release && cp artifacts/* release/

      - name: Build desktop — Linux (x64 + arm64)
        working-directory: desktop
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          npx electrobun build --env=${{ steps.build-env.outputs.env }} --targets=linux-x64,linux-arm64
          cp artifacts/* release/

      - name: Build desktop — Windows (x64)
        working-directory: desktop
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          npx electrobun build --env=${{ steps.build-env.outputs.env }} --targets=win-x64
          cp artifacts/* release/

      - name: List artifacts
        working-directory: desktop
        run: ls -lhR release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: RemoteCode v${{ steps.version.outputs.value }}
          draft: false
          prerelease: ${{ steps.build-env.outputs.prerelease }}
          generate_release_notes: true
          files: desktop/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

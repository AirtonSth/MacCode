name: Claude streaming TSan

# QA-mac:72 -- focused Thread Sanitizer guard for ClaudeStreamingCLIAdapter
# lock discipline while stdout events race streamEvents/list/read callers.

on:
  workflow_dispatch:
  schedule:
    - cron: '11 8 * * *'

permissions:
  contents: read

jobs:
  claude-streaming-tsan:
    name: Claude streaming adapter TSan
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run focused TSan test
        run: swift test --sanitize=thread --filter ClaudeStreamingCLIAdapterConcurrencyTests/test_streamEventsAndSessionQueriesStayRaceFreeDuringStreamingTurn

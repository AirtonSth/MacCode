name: Terminal teardown leak guard

# QA-mac:73 -- create/stream/close many real TerminalSurface instances and fail
# if fd count or physical footprint do not return near baseline.

on:
  workflow_dispatch:
  schedule:
    - cron: '43 7 * * *'

permissions:
  contents: read

jobs:
  terminal-teardown:
    name: terminal fd + footprint stress
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      RC2_TERMINAL_TEARDOWN_ITERATIONS: '100'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run terminal teardown leak guard
        run: scripts/terminal-teardown-leak-ci.sh

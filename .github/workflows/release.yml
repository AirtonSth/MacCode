name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: stable-macos-release
  cancel-in-progress: false

jobs:
  stable_macos_arm64_dmg:
    if: github.repository == 'samuelfaj/MacCode' && startsWith(github.ref, 'refs/tags/v')
    runs-on: xcode-27
    timeout-minutes: 120
    environment: release
    env:
      AWS_REGION: us-east-1
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      S3_BUCKET: remotecode.io
      S3_DOWNLOAD_BASE_URL: https://remotecode.io/downloads/macos
      S3_DOWNLOAD_PREFIX: downloads/macos
    steps:
      - name: Require a stable semver tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a stable semver tag: $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Build, sign, notarize and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_DEVELOPER_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          AWS_RELEASE_UPLOAD_ROLE_ARN: ${{ secrets.AWS_RELEASE_UPLOAD_ROLE_ARN }}
          REMOTECODE_IO_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.REMOTECODE_IO_CLOUDFRONT_DISTRIBUTION_ID }}
        run: bash scripts/release-stable.sh

name: Claude Agent SDK advisory

# QA-mac:85 -- scheduled guard for the pinned Claude Agent SDK bridge package.
# It proves the exact defaultSDKPackageSpec still installs and emits a GitHub
# warning when npm has moved to a newer major.

on:
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'Sources/AgentRuntime/ClaudeAgentSDKBridgeAdapter.swift'
      - 'scripts/check-claude-agent-sdk-spec.sh'
      - '.github/workflows/claude-agent-sdk-advisory.yml'

permissions:
  contents: read

jobs:
  advisory:
    name: pinned SDK install + major check
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned Claude Agent SDK spec
        run: scripts/check-claude-agent-sdk-spec.sh

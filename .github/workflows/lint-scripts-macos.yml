name: Lint Scripts (macOS)

# QA-MAC :70 -- shellcheck/bash + plist/bundle linting for the macos-app/scripts/
# shell scripts. The 9-byte PkgInfo (a heredoc trailing newline; now fixed in
# package-app.sh to printf an exact 8 bytes) is the bug class this guards against.
# shellcheck uses -S error so real bugs fail the build without style-warning noise;
# bash -n catches syntax errors; plutil -lint validates committed plists.

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '**/*.plist'
      - '.github/workflows/lint-scripts-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + plist lint
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: brew install shellcheck

      - name: shellcheck (errors fail the build)
        run: shellcheck -S error scripts/*.sh

      - name: bash -n syntax check
        run: |
          for s in scripts/*.sh; do
            bash -n "$s"
          done

      - name: plutil -lint committed plists
        run: |
          found=0
          while IFS= read -r plist; do
            plutil -lint "$plist"
            found=1
          done < <(git ls-files '*.plist')
          if [ "$found" = "0" ]; then
            echo "no committed plists to lint"
          fi

      - name: Guard PkgInfo is written as exactly 8 bytes
        run: |
          # package-app.sh must printf the 8-byte "APPL????" with no trailing
          # newline. Fail if a heredoc/echo (which appends a newline -> 9 bytes)
          # is reintroduced for PkgInfo.
          if grep -nE 'PkgInfo"? *<<' scripts/package-app.sh; then
            echo "PkgInfo must be printf'd (8 bytes), not heredoc'd (9 bytes)" >&2
            exit 1
          fi

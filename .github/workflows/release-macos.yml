name: Release macOS DMG

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the DMG to
        required: true

permissions:
  contents: write

jobs:
  stable-macos-arm64-dmg:
    name: stable-macos-arm64-RemoteCode.dmg
    runs-on: macos-14
    env:
      ASSET_NAME: stable-macos-arm64-RemoteCode.dmg
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          lfs: true

      - name: Resolve release tag
        id: release
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          RC2_VERSION: ${{ steps.release.outputs.version }}
          RC2_DMG_NAME: ${{ env.ASSET_NAME }}
        run: |
          test "$(uname -m)" = "arm64"
          scripts/package-dmg.sh
          hdiutil verify "dist/$ASSET_NAME"

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" "dist/$ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

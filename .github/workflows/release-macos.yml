name: Release macOS DMG

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the DMG to
        required: true

permissions:
  contents: write

jobs:
  stable-macos-arm64-dmg:
    name: stable-macos-arm64-RemoteCode.dmg
    runs-on: macos-14
    env:
      ASSET_NAME: stable-macos-arm64-RemoteCode.dmg
      CODESIGN_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 || secrets.MACOS_CERTIFICATE }}
      CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD || secrets.MACOS_CERTIFICATE_PWD }}
      EXPECTED_CODESIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY || secrets.ELECTROBUN_DEVELOPER_ID }}
      NOTARY_APPLE_ID: ${{ secrets.APPLE_ID || secrets.ELECTROBUN_APPLEID }}
      NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.ELECTROBUN_TEAMID }}
      NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.ELECTROBUN_APPLEIDPASS }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          lfs: true

      - name: Resolve release tag
        id: release
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        run: |
          if [ -z "$CODESIGN_P12_BASE64" ] || [ -z "$CODESIGN_P12_PASSWORD" ]; then
            echo "Missing Developer ID certificate secrets"
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/remotecode-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/developer-id.p12"
          echo "$CODESIGN_P12_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$CODESIGN_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$KEYCHAIN"

          if [ -n "$EXPECTED_CODESIGN_IDENTITY" ]; then
            IDENTITY="$EXPECTED_CODESIGN_IDENTITY"
            if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "\"$IDENTITY\"" >/dev/null; then
              echo "Expected Developer ID identity not found in imported certificate"
              exit 1
            fi
          else
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          fi
          if [ -z "$IDENTITY" ]; then
            echo "Developer ID Application identity not found in imported certificate"
            exit 1
          fi
          echo "RC2_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Verify notarization credentials
        run: |
          if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_TEAM_ID" ] || [ -z "$NOTARY_PASSWORD" ]; then
            echo "Missing notarization secrets"
            exit 1
          fi

      - name: Build DMG
        env:
          RC2_VERSION: ${{ steps.release.outputs.version }}
          RC2_DMG_NAME: ${{ env.ASSET_NAME }}
        run: |
          test "$(uname -m)" = "arm64"
          scripts/package-dmg.sh
          hdiutil verify "dist/$ASSET_NAME"

      - name: Notarize DMG
        run: |
          xcrun notarytool submit "dist/$ASSET_NAME" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "dist/$ASSET_NAME"
          spctl --assess --type open --context context:primary-signature --verbose=4 "dist/$ASSET_NAME"

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" "dist/$ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

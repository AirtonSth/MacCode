name: Release macOS DMG

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the DMG to
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  stable-macos-arm64-dmg:
    name: stable-macos-arm64-RemoteCode.dmg
    runs-on: macos-15
    env:
      ASSET_NAME: stable-macos-arm64-RemoteCode.dmg
      GHOSTTYKIT_ASSET: GhosttyKit.xcframework.tar.gz
      AWS_REGION: us-east-1
      AWS_RELEASE_UPLOAD_ROLE_ARN: ${{ secrets.AWS_RELEASE_UPLOAD_ROLE_ARN }}
      S3_BUCKET: remotecode.io
      S3_DOWNLOAD_PREFIX: downloads/macos
      S3_DOWNLOAD_BASE_URL: https://remotecode.io/downloads/macos
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.REMOTECODE_IO_CLOUDFRONT_DISTRIBUTION_ID }}
      CODESIGN_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 || secrets.MACOS_CERTIFICATE }}
      CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD || secrets.MACOS_CERTIFICATE_PWD }}
      EXPECTED_CODESIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY || secrets.ELECTROBUN_DEVELOPER_ID }}
      NOTARY_APPLE_ID: ${{ secrets.APPLE_ID || secrets.ELECTROBUN_APPLEID }}
      NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || secrets.ELECTROBUN_TEAMID }}
      NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.ELECTROBUN_APPLEIDPASS }}
    steps:
      - name: Select Xcode with Swift 6.1+
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          lfs: false

      - name: Resolve release tag
        id: release
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Restore GhosttyKit vendor artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$GHOSTTYKIT_ASSET" \
            --dir "$RUNNER_TEMP"
          rm -rf Vendor/GhosttyKit.xcframework
          tar -xzf "$RUNNER_TEMP/$GHOSTTYKIT_ASSET" -C .
          test -f Vendor/GhosttyKit.xcframework/macos-arm64_x86_64/libGhosttyKit.a

      - name: Import Developer ID certificate
        run: |
          if [ -z "$CODESIGN_P12_BASE64" ] || [ -z "$CODESIGN_P12_PASSWORD" ]; then
            echo "Missing Developer ID certificate secrets"
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/remotecode-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/developer-id.p12"
          echo "$CODESIGN_P12_BASE64" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$CODESIGN_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$KEYCHAIN"

          if [ -n "$EXPECTED_CODESIGN_IDENTITY" ]; then
            IDENTITY="$EXPECTED_CODESIGN_IDENTITY"
            if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "\"$IDENTITY\"" >/dev/null; then
              echo "Expected Developer ID identity not found in imported certificate"
              exit 1
            fi
          else
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          fi
          if [ -z "$IDENTITY" ]; then
            echo "Developer ID Application identity not found in imported certificate"
            exit 1
          fi
          echo "RC2_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Verify notarization credentials
        run: |
          if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_TEAM_ID" ] || [ -z "$NOTARY_PASSWORD" ]; then
            echo "Missing notarization secrets"
            exit 1
          fi

      - name: Build DMG
        env:
          RC2_VERSION: ${{ steps.release.outputs.version }}
          RC2_DMG_NAME: ${{ env.ASSET_NAME }}
          RC2_REQUIRE_SPARKLE_KEY: "1"
          RC2_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          RC2_SPARKLE_FEED_URL: ${{ env.S3_DOWNLOAD_BASE_URL }}/appcast.xml
        run: |
          test "$(uname -m)" = "arm64"
          scripts/package-dmg.sh
          hdiutil verify "dist/$ASSET_NAME"

      - name: Notarize DMG
        run: |
          xcrun notarytool submit "dist/$ASSET_NAME" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "dist/$ASSET_NAME"
          spctl --assess --type open --context context:primary-signature --verbose=4 "dist/$ASSET_NAME"

      - name: Verify mounted app Gatekeeper acceptance
        run: |
          MOUNT="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT" "dist/$ASSET_NAME"
          trap 'hdiutil detach "$MOUNT"; rmdir "$MOUNT"' EXIT
          codesign --verify --deep --strict --verbose=4 "$MOUNT/RemoteCode.app"
          spctl --assess --type execute --verbose=4 "$MOUNT/RemoteCode.app"

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" "dist/$ASSET_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Check S3 release upload configuration
        id: s3
        run: |
          if [ -z "$AWS_RELEASE_UPLOAD_ROLE_ARN" ]; then
            echo "AWS_RELEASE_UPLOAD_ROLE_ARN secret is required for public macOS downloads"
            exit 1
          fi
          if [ -z "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "REMOTECODE_IO_CLOUDFRONT_DISTRIBUTION_ID secret is required for release download invalidation"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials for S3 release upload
        if: ${{ steps.s3.outputs.enabled == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_RELEASE_UPLOAD_ROLE_ARN }}

      - name: Upload DMG to S3
        if: ${{ steps.s3.outputs.enabled == 'true' }}
        run: |
          aws s3 cp "dist/$ASSET_NAME" "s3://$S3_BUCKET/$S3_DOWNLOAD_PREFIX/${{ steps.release.outputs.tag }}/$ASSET_NAME" \
            --content-type "application/x-apple-diskimage" \
            --acl public-read \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "dist/$ASSET_NAME" "s3://$S3_BUCKET/$S3_DOWNLOAD_PREFIX/latest/$ASSET_NAME" \
            --content-type "application/x-apple-diskimage" \
            --acl public-read \
            --cache-control "no-cache, max-age=0"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Missing Sparkle private key secret"
            exit 1
          fi
          SPARKLE_TOOLS=".build/artifacts/sparkle/Sparkle/bin"
          SIGN_UPDATE="$SPARKLE_TOOLS/sign_update"
          if [ ! -x "$SIGN_UPDATE" ]; then
            echo "Sparkle sign_update tool not found at $SIGN_UPDATE"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/sparkle_ed_private_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          SIGNATURE="$("$SIGN_UPDATE" --ed-key-file "$KEY_FILE" "dist/$ASSET_NAME")"
          APPCAST_URL="$S3_DOWNLOAD_BASE_URL/appcast.xml"
          DMG_URL="$S3_DOWNLOAD_BASE_URL/${{ steps.release.outputs.tag }}/$ASSET_NAME"
          mkdir -p dist/pages
          cat > dist/pages/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>RemoteCode Updates</title>
              <link>$APPCAST_URL</link>
              <description>RemoteCode macOS updates</description>
              <item>
                <title>RemoteCode ${{ steps.release.outputs.version }}</title>
                <sparkle:version>${{ steps.release.outputs.version }}</sparkle:version>
                <sparkle:shortVersionString>${{ steps.release.outputs.version }}</sparkle:shortVersionString>
                <pubDate>$(date -Ru)</pubDate>
                <enclosure url="$DMG_URL" type="application/x-apple-diskimage" $SIGNATURE />
              </item>
            </channel>
          </rss>
          EOF
          grep -F "sparkle:edSignature" dist/pages/appcast.xml
          grep -F "$ASSET_NAME" dist/pages/appcast.xml

      - name: Upload Sparkle appcast to S3
        if: ${{ steps.s3.outputs.enabled == 'true' }}
        run: |
          aws s3 cp "dist/pages/appcast.xml" "s3://$S3_BUCKET/$S3_DOWNLOAD_PREFIX/appcast.xml" \
            --content-type "application/xml; charset=utf-8" \
            --acl public-read \
            --cache-control "no-cache, max-age=0"

      - name: Upload Sparkle appcast to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" "dist/pages/appcast.xml" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Invalidate release downloads on CloudFront
        if: ${{ steps.s3.outputs.enabled == 'true' && env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/$S3_DOWNLOAD_PREFIX/appcast.xml" "/$S3_DOWNLOAD_PREFIX/latest/$ASSET_NAME" "/$S3_DOWNLOAD_PREFIX/${{ steps.release.outputs.tag }}/$ASSET_NAME"

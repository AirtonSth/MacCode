name: PR Unit Tests (macOS)

# QA-MAC :67 -- run the SwiftPM unit suite on every PR so regressions are caught
# at review time instead of surfacing only at release. Mirrors the environment of
# release-macos.yml (macos-14 runner + the vendored GhosttyKit xcframework that the
# build links) and runs scripts/test-unit.sh (the same `swift test` invocation used
# locally). GhosttyKit is a binary vendor artifact published as a GitHub release
# asset; we restore it from the latest release so PR builds link the same library.

on:
  pull_request:
    branches: [main, june-09]
  workflow_dispatch:

concurrency:
  group: pr-unit-tests-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: swift test (macos-14)
    runs-on: macos-14
    env:
      GHOSTTYKIT_ASSET: GhosttyKit.xcframework.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Restore GhosttyKit vendor artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No release tag in a PR context -- pull the asset from the most recent
          # release (the same artifact the release pipeline publishes). The build
          # only needs the static lib + headers to link the test bundle.
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$GHOSTTYKIT_ASSET" \
            --dir "$RUNNER_TEMP"
          rm -rf Vendor/GhosttyKit.xcframework
          tar -xzf "$RUNNER_TEMP/$GHOSTTYKIT_ASSET" -C .
          test -f Vendor/GhosttyKit.xcframework/macos-arm64_x86_64/libGhosttyKit.a

      - name: Run unit tests
        run: scripts/test-unit.sh

name: macOS Agent perf guards

# QA-mac:77/78 -- CI gate for thread-open replay and wide layout rebuild.
# The focused tests assert bounded wall-clock cost for 5,000-event replay and
# 6-pane/40-tab structural rebuilds.

on:
  pull_request:
    paths:
      - 'Sources/Surfaces/AgentAppSurface.swift'
      - 'Tests/SurfacesTests/AgentAppPerfBundleTests.swift'
      - '.github/workflows/macos-agent-perf-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-perf:
    name: replay + wide-layout budgets
    runs-on: macos-15
    env:
      GHOSTTYKIT_ASSET: GhosttyKit.xcframework.tar.gz
      RC2_WIDE_LAYOUT_REBUILD_BUDGET_MS: 3000
    steps:
      - name: Select Xcode with Swift 6.1+
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Export selected Xcode developer dir
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Restore GhosttyKit vendor artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$GHOSTTYKIT_ASSET" \
            --dir "$RUNNER_TEMP"
          rm -rf Vendor/GhosttyKit.xcframework
          tar -xzf "$RUNNER_TEMP/$GHOSTTYKIT_ASSET" -C .
          test -f Vendor/GhosttyKit.xcframework/macos-arm64_x86_64/libGhosttyKit.a

      - name: Run replay and wide-layout benchmarks
        run: swift test --filter 'AgentAppPerfBundleTests/test_threadOpenReplayFiveThousandEventsStaysWithinBudget|MainWindowControllerRebuildCountTests/test_wideLayoutSixPanesFortyTabs_rebuildsWithinBudget'

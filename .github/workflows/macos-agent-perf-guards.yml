name: macOS Agent perf guards

# QA-mac:77/78 -- CI gate for thread-open replay and wide layout rebuild.
# The focused tests assert bounded wall-clock cost for 5,000-event replay and
# 6-pane/40-tab structural rebuilds.

on:
  pull_request:
    paths:
      - 'Sources/Surfaces/AgentAppSurface.swift'
      - 'Tests/SurfacesTests/AgentAppPerfBundleTests.swift'
      - '.github/workflows/macos-agent-perf-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-perf:
    name: replay + wide-layout budgets
    runs-on: macos-14
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run replay and wide-layout benchmarks
        run: swift test --filter 'AgentAppPerfBundleTests/test_threadOpenReplayFiveThousandEventsStaysWithinBudget|MainWindowControllerRebuildCountTests/test_wideLayoutSixPanesFortyTabs_rebuildsWithinBudget'

name: Main-thread-blocking ratchet (macOS)

# QA-mac:82 -- fail the build when a NEW NSAlert.runModal(), Thread.sleep, or
# DispatchSemaphore blocking call is added to Sources/. The current counts are
# frozen in scripts/main-thread-blocking-baseline.txt; the lint only fails when a
# count goes UP. Removing offenders is fine (re-run with --regen to lower the
# baseline). Guards the Perf #5/#8 offender classes from regrowing.

on:
  pull_request:
    paths:
      - 'Sources/**/*.swift'
      - 'scripts/lint-main-thread-blocking.sh'
      - 'scripts/main-thread-blocking-baseline.txt'
      - '.github/workflows/lint-main-thread-blocking-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ratchet:
    name: no new main-thread-blocking calls
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run ratchet
        run: bash scripts/lint-main-thread-blocking.sh

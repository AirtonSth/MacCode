name: TSan persistence concurrency (macOS)

# QA-mac:72(b) -- run the multi-threaded persistence stress tests under
# ThreadSanitizer. The repos are called from the main thread, socket threads and
# the coordinator queue (T007); these tests hammer a shared FULLMUTEX connection
# concurrently. TSan mechanically catches any data race on the connection or the
# prepared-statement cache (the bug this lane was added to guard: a shared cached
# sqlite3_stmt used outside the serial queue clobbered concurrent writes).

on:
  pull_request:
    paths:
      - 'Sources/Persistence/**'
      - 'Tests/PersistenceTests/PersistenceConcurrencyStressTests.swift'
      - '.github/workflows/tsan-persistence-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tsan:
    name: persistence stress under TSan
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode toolchain
        run: echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: swift test --sanitize=thread (persistence stress)
        run: swift test --sanitize=thread --filter PersistenceConcurrencyStressTests

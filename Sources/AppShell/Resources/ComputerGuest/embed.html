<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RemoteCode guest</title>
  <style>
    html, body, iframe { margin: 0; padding: 0; width: 100%; height: 100%; border: 0; background: #111; }
  </style>
</head>
<body>
  <iframe id="screen" title="Guest screen"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";
    const frame = document.getElementById("screen");
    frame.src = "/vnc.html?autoconnect=1&resize=scale&view_only=0&path=websockify?token=" + encodeURIComponent(token);
  </script>
</body>
</html>
